<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript practice</title>
  <script defer src="app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>My portfolio projects</h1>
<div aria-label="Filter projects">
  <button id="all" type="button" aria-pressed="true">All</button>
  <button id="web" type="button" aria-pressed="false">Web</button>
  <button id="design" type="button" aria-pressed="false">Design</button>
</div>
<p id="status" role="status">3 projects</p>
<ul>
  <li data-category="web">Personal profile</li>
  <li data-category="web">Study planner</li>
  <li data-category="design">Community poster</li>
</ul>
<noscript>All projects are shown. Filtering requires JavaScript.</noscript>
</body>
</html>
