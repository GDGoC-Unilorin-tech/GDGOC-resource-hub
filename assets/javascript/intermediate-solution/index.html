<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript practice</title>
  <script defer src="app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>My portfolio project explorer</h1>
<p>Explore my work by title and category.</p>
<form id="search-form">
  <label for="query">Search project titles</label>
  <input id="query" type="search" name="query">
  <button type="submit">Search</button>
</form>
<div id="filters" aria-label="Filter projects">
  <button type="button" data-category="all" aria-pressed="true">All</button>
  <button type="button" data-category="web" aria-pressed="false"><span>Web</span></button>
  <button type="button" data-category="design" aria-pressed="false">Design</button>
</div>
<button id="load" type="button">Reload projects</button>
<p id="storage-note"></p>
<p id="status" role="status">Loading projects…</p>
<ul id="projects"></ul>
<noscript>JavaScript is needed for this explorer. My projects include Personal profile, Study planner, and Community poster.</noscript>
</body>
</html>
